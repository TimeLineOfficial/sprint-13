user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;

    # Performance Tuning & Keep-Alive
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Rate Limiting (Token Bucket)
    limit_req_zone $binary_remote_addr zone=api_gateway_rate:10m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=addr_conn:10m;

    # Upstream Microservice Clusters
    upstream auth_cluster {
        server auth-service:4001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream dispatch_cluster {
        server dispatch-service:4002 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream telemetry_cluster {
        server telemetry-service:4003 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream worker_websocket_cluster {
        server analytics-worker:4004 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        root /usr/share/nginx/html;
        index index.html;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Health Endpoint
        location /health {
            access_log off;
            return 200 '{"status":"UP","gateway":"Nginx Edge Router","timestamp":"2026-11-08T14:55:00Z"}\n';
            add_header Content-Type application/json;
        }

        # Static Web Application Files
        location / {
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, no-transform";
        }

        # Microservice Route: Auth & IAM
        location /api/v1/auth/ {
            limit_req zone=api_gateway_rate burst=20 nodelay;
            proxy_pass http://auth_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Microservice Route: Fleet & Dispatch
        location /api/v1/dispatch/ {
            limit_req zone=api_gateway_rate burst=30 nodelay;
            proxy_pass http://dispatch_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Microservice Route: High-Throughput Telemetry Ingestion
        location /api/v1/telemetry/ {
            limit_req zone=api_gateway_rate burst=50 nodelay;
            proxy_pass http://telemetry_cluster/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket Route: Live Telemetry Event Stream
        location /ws/live-stream {
            proxy_pass http://worker_websocket_cluster/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }
    }
}
